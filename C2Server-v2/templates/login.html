<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — C2 Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #e6edf3;
            text-align: center;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #58a6ff; }
        button {
            width: 100%;
            padding: 0.6rem;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #2ea043; }
        .error {
            background: #3d1a1a;
            border: 1px solid #f85149;
            border-radius: 6px;
            color: #f85149;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>C2 Dashboard</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
